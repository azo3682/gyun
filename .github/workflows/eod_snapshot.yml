name: EOD Snapshot

on:
  schedule:
    - cron: "40 6 * * 1-5"   # 매일 15:40 KST (= 06:40 UTC), 월~금
  workflow_dispatch: {}       # 수동 실행 버튼도 제공

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-actions.txt
      - name: Restore KIS token cache
        uses: actions/cache@v4
        with:
          path: .kis_token_cache
          key: kis-token-${{ github.run_id }}
          restore-keys: |
            kis-token-
      - name: Run EOD snapshot
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_TOKEN_CACHE: ${{ github.workspace }}/.kis_token_cache/token.json
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          cd scripts
          python eod_snapshot.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/eod_snapshot.json
          # 관찰목록(watchlist.json)은 제거됨 — 파일이 남아 있을 때만 커밋하고, 없어도 오류로 멈추지 않게 한다
          git add data/watchlist.json 2>/dev/null || true
          git add data/history 2>/dev/null || true
          git add data/signal_tracker.json 2>/dev/null || true
          git add data/index_history.json 2>/dev/null || true
          git add data/top10_baseline.json 2>/dev/null || true
          git commit -m "Update EOD snapshot [skip ci]" || { echo "no changes"; exit 0; }
          # 다른 워크플로(AI Report 등)가 먼저 푸시했으면 최신 상태 위로 다시 얹어서 올린다 (최대 3번)
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          echo "push failed after 3 attempts"
          exit 1
