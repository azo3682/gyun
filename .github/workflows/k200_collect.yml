name: K200 Collect

on:
  schedule:
    - cron: "50 6 * * 1-5"   # 매일 15:50 KST (= 06:50 UTC), 월~금 — 장 마감 후 분봉·일봉·NAV 수집
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "과거 분봉을 이 일수만큼 채워보기 (0이면 안 함)"
        required: false
        default: "0"
      daily_years:
        description: "일봉 수집 기간(년)"
        required: false
        default: "3"

permissions:
  contents: write

# 다른 기록용 워크플로와 같은 파일을 동시에 고치지 않도록 한 번에 하나만 실행한다
concurrency:
  group: tracker-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-actions.txt
      - name: Restore KIS token cache
        uses: actions/cache@v4
        with:
          path: .kis_token_cache
          key: kis-token-${{ github.run_id }}
          restore-keys: |
            kis-token-
      - name: Collect KODEX 200 data
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_TOKEN_CACHE: ${{ github.workspace }}/.kis_token_cache/token.json
          K200_BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '0' }}
          K200_DAILY_YEARS: ${{ github.event.inputs.daily_years || '3' }}
        run: |
          cd scripts
          python k200_collect.py
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/k200
          git commit -m "Update K200 data [skip ci]" || { echo "no changes"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          echo "push failed after 3 attempts"
          exit 1
